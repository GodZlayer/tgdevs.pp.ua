<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030607">
  <meta name="description" content="Sistemas que simplificam.">
  <meta property="og:title" content="TGDevs — Sistemas que simplificam">
  <meta property="og:image" content="https://www.tgdevs.pp.ua/blender/assets/tgdevs-og-r2.jpg?v=24">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://www.tgdevs.pp.ua/">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="canonical" href="https://www.tgdevs.pp.ua/">
  <link rel="icon" type="image/png" href="blender/assets/tgdevs-favicon-r3.png?v=24" sizes="512x512">
  <title>TGDevs — Sistemas que simplificam</title>
  <link rel="stylesheet" href="site-webgpu.css?build=opening-black-r1">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/webgpu/three.webgpu.min.js",
        "three/webgpu": "./vendor/webgpu/three.webgpu.min.js",
        "three/tsl": "./vendor/webgpu/three.tsl.min.js",
        "three/addons/": "./vendor/webgpu/addons/"
      }
    }
  </script>
</head>
<body>
  <main id="experience">
    <div id="sceneBackdrop" aria-hidden="true"></div>
    <canvas id="world" aria-label="Apresentação 3D TGDevs e TG Business Center"></canvas>
    <div class="scroll-hint" id="scrollHint"><span class="wheel"></span><span>Role para descobrir</span></div>
    <div class="progress" aria-hidden="true"><i id="progress"></i></div>
    <div class="status" id="status">INICIANDO EXPERIÊNCIA 3D</div>
  </main>
  <div id="scrollTrack" aria-hidden="true"></div>
  <section id="timelineEditor" class="timeline-editor" aria-label="Editor interativo da timeline Blender" hidden>
    <header class="timeline-editor__header">
      <div><strong>TGDevs · Timeline</strong><span id="timelineMarkerLabel">Frame 0</span></div>
      <nav id="timelineMarkers" aria-label="Marcadores da cena"></nav>
    </header>
    <input id="timelineScrubber" type="range" min="0" max="1000" value="0" step="1" aria-label="Frame da timeline" />
    <footer><span id="timelineFrameLabel">00:00:00</span><span>Preview sincronizado com a timeline do Blender</span><a href="./blender/GPU_VALIDATION_README.md" target="_blank" rel="noreferrer">Fluxo Blender</a></footer>
  </section>
  <script type="module" src="site-webgpu.js?build=single-glb-universe-r1"></script>
</body>
</html>
